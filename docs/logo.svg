<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 132" width="700" height="132"
     role="img" aria-label="llm-tracker">
  <title>llm-tracker</title>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62A3F2"/>
      <stop offset="1" stop-color="#2A78D6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <g transform="translate(6,6) scale(0.234)">
<rect width="512" height="512" rx="114" fill="url(#lbg)"/>

  <!-- A clean 1-2-3-4 staircase of stacked blocks: a chart made of tokens.
       Four columns and four rows at most, because finer detail disappears
       below 32px and only muddies the silhouette. -->
  <g fill="#fff">
    <rect x="92"  y="316" width="66" height="58" rx="17"/>

    <rect x="178" y="316" width="66" height="58" rx="17"/>
    <rect x="178" y="246" width="66" height="58" rx="17"/>

    <rect x="264" y="316" width="66" height="58" rx="17"/>
    <rect x="264" y="246" width="66" height="58" rx="17"/>
    <rect x="264" y="176" width="66" height="58" rx="17"/>

    <rect x="350" y="316" width="66" height="58" rx="17"/>
    <rect x="350" y="246" width="66" height="58" rx="17"/>
    <rect x="350" y="176" width="66" height="58" rx="17"/>
    <rect x="350" y="106" width="66" height="58" rx="17" fill="url(#fade)"/>
  </g>

  <!-- Baseline grounds the columns so they read as a chart, not loose tiles. -->
  <rect x="92" y="396" width="324" height="18" rx="9" fill="#fff" opacity="0.5"/>
  </g>

  <text x="152" y="62" font-family="ui-sans-serif,-apple-system,'SF Pro Display',system-ui,sans-serif"
        font-size="38" font-weight="650" letter-spacing="-1" fill="#111">llm-tracker</text>
  <text x="154" y="94" font-family="ui-sans-serif,-apple-system,'SF Pro Text',system-ui,sans-serif"
        font-size="16" fill="#6b6b6b">Token usage across every AI coding agent you use</text>
</svg>
