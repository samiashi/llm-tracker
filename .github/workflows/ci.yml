name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: |
            agent/go.sum
            server/go.sum
      # Third-party, so pinned to a commit: a tag is mutable. Installs the
      # version .golangci-lint-version names; make runs it, as locally.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true
      - run: make lint-go test-go

  # The agent is a macOS daemon, and launchd/ drives macOS's launchctl:
  # cross-compiling them proves they link, not that they run.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          # The root has go.work and no go.mod, so without this setup-go finds
          # no dependency file and caches nothing -- costliest here, where
          # macOS bills at ten times the Linux rate.
          cache-dependency-path: |
            agent/go.sum
            server/go.sum
      - run: go test ./schema/... ./launchd/... ./agent/...

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: make lint-dashboard test-dashboard
      - run: npm run build
        working-directory: dashboard
